name: Build NICO Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout NICO distribution repo
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download pinned Mark-LV source
        shell: pwsh
        run: |
          git clone https://github.com/FatihMakes/Mark-LV.git build/Mark-LV
          cd build/Mark-LV
          git checkout c3e795af71bff38bb406c62a2e7a63869cdc8eb2

      - name: Apply NICO Pro patch
        shell: pwsh
        run: python windows/patch_nico.py build/Mark-LV

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r build/Mark-LV/requirements.txt
          python -m pip install pyinstaller

      - name: Build NICO portable app
        shell: pwsh
        working-directory: build/Mark-LV
        run: python -m PyInstaller main.py --name NICO --noconsole --onedir --clean --noconfirm --add-data "actions;actions" --add-data "core;core" --add-data "memory;memory" --add-data "dashboard;dashboard" --add-data "plugins;plugins" --add-data "THIRD_PARTY_NOTICES.txt;." --hidden-import mss --hidden-import PIL --hidden-import playwright.sync_api --hidden-import fastapi --hidden-import uvicorn --hidden-import cryptography --hidden-import qrcode --hidden-import cv2 --hidden-import pyautogui --hidden-import pyperclip --hidden-import send2trash --hidden-import win32com.client --hidden-import wmi

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Create installer script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $iss = @"
          [Setup]
          AppName=NICO AI
          AppVersion=1.0.0
          AppPublisher=NICO
          DefaultDirName={localappdata}\NICO AI
          DefaultGroupName=NICO AI
          OutputDir=..\..\..\release
          OutputBaseFilename=NICO-Setup
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          WizardStyle=modern
          UninstallDisplayName=NICO AI

          [Files]
          Source: "dist\NICO\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\NICO AI"; Filename: "{app}\NICO.exe"
          Name: "{autodesktop}\NICO"; Filename: "{app}\NICO.exe"

          [Run]
          Filename: "{app}\NICO.exe"; Description: "Abrir NICO"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path build/Mark-LV/NICO.iss -Value $iss -Encoding UTF8

      - name: Build Windows installer
        shell: pwsh
        working-directory: build/Mark-LV
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" NICO.iss'

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/Mark-LV/dist/NICO/* -DestinationPath release/NICO-Portable.zip -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NICO-Windows-Installer
          path: release/NICO-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: NICO-Windows-Portable
          path: release/NICO-Portable.zip
          if-no-files-found: error
          retention-days: 30